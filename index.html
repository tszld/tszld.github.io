<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>心理咨询小站</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #4a90e2;
      color: white;
      padding: 20px;
      text-align: center;
    }

    section {
      padding: 60px 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    section:nth-child(even) {
      background: #f5f6f8;
    }

    h2 {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #4a90e2;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .result {
      margin-top: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>

<body>

<header>
  <h1>心理咨询小站</h1>
  <p>关注你的情绪状态</p>
</header>

<!-- 情绪测试 -->
<section>
  <h2>今天你的心情如何？</h2>

  <select id="mood">
    <option value="happy">开心 😊</option>
    <option value="normal">一般 😐</option>
    <option value="sad">难过 😢</option>
  </select>

  <button onclick="checkMood()">查看建议</button>

  <div class="result" id="moodResult"></div>
</section>

<!-- 留言咨询 -->
<section>
  <h2>留言咨询</h2>

  <textarea id="message" placeholder="写下你的烦恼..."></textarea>

  <button onclick="submitMessage()">提交</button>

  <div class="result" id="msgResult"></div>
</section>

<!-- 简单介绍 -->
<section>
  <h2>关于我们</h2>
  <p>
    我们提供基础心理支持建议。如果你长期感到情绪困扰，建议寻求专业帮助。
  </p>
</section>

<script>
  function checkMood() {
    const mood = document.getElementById("mood").value;
    const result = document.getElementById("moodResult");

    if (mood === "happy") {
      result.innerText = "太好了！继续保持，让快乐延续～";
    } else if (mood === "normal") {
      result.innerText = "可以尝试运动或听音乐，让自己放松一下。";
    } else {
      result.innerText = "也许你需要休息一下，或者找人聊聊。";
    }
  }

  function submitMessage() {
    const msg = document.getElementById("message").value;
    const result = document.getElementById("msgResult");

    if (msg.trim() === "") {
      result.innerText = "请输入内容再提交。";
      return; 
      //return作用是立即中止function 提示也可选返回值。多层嵌套只中止一层。
    }

    result.innerText = "我们已收到你的留言，会尽快关注你的情况 ❤️";
  }
</script>

</body>
</html>
